[env:stable]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
framework = arduino
lib_extra_dirs = ~/Arduino/libraries

;for ESP32 boards (4MB flash)
board = esp32dev
board_build.partitions = minspiff.csv
;enable max debugging 
build_flags = -DCORE_DEBUG_LEVEL=5


[env:stable-s3]
;this one is probably fine to attempt to keep up to date.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
framework = arduino
lib_extra_dirs = ~/Arduino/libraries

;for ESP32-S3 boards (8MB flash)
board_build.partitions = app_s3.csv
board = esp32-s3-devkitc-1
;enable max debugging and set so that Serial is the USB port and automatically started on boot
build_flags = -DCORE_DEBUG_LEVEL=5 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:t2canfd]
;LilyGO T-2CAN-FD (ESP32-S3-WROOM-1U N16R8). CAN0 = built-in TWAI (LilyGO "CAN B"),
;CAN1 = MCP2518FD on SPI (LilyGO "CAN A", the CAN FD capable bus).
;Libraries are pinned here instead of relying on ~/Arduino/libraries.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = app_s3.csv
lib_deps =
    https://github.com/collin80/can_common.git#8585f9dc807ebbeedeb509d74159f40f538d2d65
    https://github.com/collin80/esp32_can.git#c329e6be6931e86f82e38e0f982c9ed951c45cca
    https://github.com/collin80/esp32_mcp2517fd.git#15624220ba3bc2c3e461dc4a0c8e2e3a20d4e94d
    fastled/FastLED@3.10.6
monitor_speed = 1000000
build_flags = -DCORE_DEBUG_LEVEL=1 -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D BOARD_T2CANFD
